<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>90-Day Challenge</title>
  <meta name="description" content="Vandana's 90-day job-ready tracker: daily goals, big goals and drift.">
  <meta name="theme-color" content="#1f3a5f">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%231f3a5f'/%3E%3Ctext x='32' y='42' font-size='26' font-family='Arial' font-weight='700' text-anchor='middle' fill='white'%3E90%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#/today" aria-label="90-Day Challenge home">
      <span class="brand-mark">90</span>
      <span class="brand-text">90-Day Challenge</span>
    </a>
    <div class="topbar-right">
      <span class="day-pill" id="day-pill">Loading…</span>
      <button class="icon-btn" id="theme-toggle" type="button" aria-label="Toggle dark mode" title="Toggle dark mode">☾</button>
    </div>
  </header>

  <nav class="tabs" id="tabs" aria-label="Main">
    <a href="#/today" data-route="today">Today</a>
    <a href="#/dashboard" data-route="dashboard">Drift</a>
    <a href="#/goals" data-route="goals">Big Goals</a>
    <a href="#/plan" data-route="plan">90 Days</a>
    <a href="#/jobs" data-route="jobs">Jobs</a>
    <a href="#/practice" data-route="practice">Practice</a>
    <a href="#/focus" data-route="focus">Focus</a>
    <a href="#/settings" data-route="settings">Settings</a>
  </nav>

  <main id="app" class="container" tabindex="-1">
    <p class="muted">Loading your plan…</p>
  </main>

  <footer class="footer">
    <span>Never zero. Never double up. Progress, not perfection.</span>
  </footer>

  <script type="module" src="js/app.js"></script>
</body>
</html>
